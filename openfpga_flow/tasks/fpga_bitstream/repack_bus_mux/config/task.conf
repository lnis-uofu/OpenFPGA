# = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
# Check that repacking preserves VPR's bus mux input-set selections.
#
# The 32-bit multiplier's 'a2a' mux selects A_cfg (set 0) or B_cfg (set 1).
# A second bus mux, 'a2a_swap', lets A_cfg take either operand. Perimeter pin
# locations keep the multi-height DSP tiles routable.
#  - mult_32x32 (A*B): only A_cfg can deliver 'a'.
#  - square_32 (A*A): VPR uses only 'b' pins. Repacking can reach input 'a'
#    through either B_cfg directly or A_cfg via a2a_swap, and must follow VPR.
#
# Run with flat and cluster routing.
# = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

[GENERAL]
run_engine=openfpga_shell
power_tech_file = ${PATH:OPENFPGA_PATH}/openfpga_flow/tech/PTM_45nm/45nm.xml
power_analysis = false
spice_output=false
verilog_output=false
timeout_each_job = 20*60
fpga_flow=vpr_blif

[OpenFPGA_SHELL]
openfpga_shell_template=${PATH:OPENFPGA_PATH}/openfpga_flow/openfpga_shell_scripts/bus_mux_repack_example_script.openfpga
openfpga_arch_file=${PATH:OPENFPGA_PATH}/openfpga_flow/openfpga_arch/k4_frac_N4_adder_chain_mem1K_frac_dsp32_40nm_frame_openfpga.xml
openfpga_sim_setting_file=${PATH:OPENFPGA_PATH}/openfpga_flow/openfpga_simulation_settings/fixed_sim_openfpga.xml
openfpga_vpr_device_layout=auto
openfpga_vpr_route_chan_width=100

[ARCHITECTURES]
arch0=${PATH:OPENFPGA_PATH}/openfpga_flow/vpr_arch/k4_frac_N4_tileable_adder_chain_mem1K_frac_dsp32_busmux_40nm.xml

[BENCHMARKS]
bench0=${PATH:TASK_DIR}/config/mult_32x32.blif
bench1=${PATH:TASK_DIR}/config/square_32.blif

[SYNTHESIS_PARAM]
bench0_top = mult_32x32
bench0_verilog = ${PATH:OPENFPGA_PATH}/openfpga_flow/benchmarks/ubm/dsp/mult/mult_32x32/mult_32x32.v
bench1_top = square_32
bench1_verilog = ${PATH:OPENFPGA_PATH}/openfpga_flow/benchmarks/ubm/dsp/mult/square_32/square_32.v

[SCRIPT_PARAM_flat_routing]
openfpga_vpr_flat_routing=on

[SCRIPT_PARAM_cluster_routing]
openfpga_vpr_flat_routing=off
