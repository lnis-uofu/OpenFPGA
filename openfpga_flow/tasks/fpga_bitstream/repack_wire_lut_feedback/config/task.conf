# = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
# Check that the bitstream selects the crossbar input that repack routed, when
# the net is also on another input of the crossbar mux.
#
# In the architecture, the output of fle[3] reaches the CLB outputs only
# through the LUT of another fle used as a wire. The output of that LUT carries
# the same net as its input, and comes before the output of fle[3] in the
# crossbar mux that drives the LUT. Selecting it closes a combinational loop,
# which the testbench detects. The VPR constraints put the LUT of output c in
# fle[3].
# = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

