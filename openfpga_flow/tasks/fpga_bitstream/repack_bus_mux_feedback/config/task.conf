# = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
# Check that the bitstream of a bus mux follows the input set repack used,
# when the net of a bit is also on another input of the mux.
#
# The 8-bit multiplier's 'a2a_bus' mux selects for operand A the low byte of
# the registered product (set 0, the output pins of ff_Y), the block input
# A_cfg (set 1) or the input register (set 2).
#  - mult_8_feedback: A is the low byte of the registered product shifted right
#    by one bit with sign extension, so it comes through A_cfg. Bit 7 of A
#    carries p[7], whose source pin ff_Y[7].Q is bit 7 of set 0.
#
# Run with flat routing, which keeps the bits of a bus mux on one input set.
# = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

[GENERAL]
run_engine=openfpga_shell
power_tech_file = ${PATH:OPENFPGA_PATH}/openfpga_flow/tech/PTM_45nm/45nm.xml
power_analysis = false
spice_output=false
verilog_output=false
timeout_each_job = 20*60
fpga_flow=vpr_blif

[OpenFPGA_SHELL]
openfpga_shell_template=${PATH:OPENFPGA_PATH}/openfpga_flow/openfpga_shell_scripts/bus_mux_repack_example_script.openfpga
openfpga_arch_file=${PATH:OPENFPGA_PATH}/openfpga_flow/openfpga_arch/k4_N4_40nm_dsp8reg_cc_openfpga.xml
openfpga_sim_setting_file=${PATH:OPENFPGA_PATH}/openfpga_flow/openfpga_simulation_settings/fixed_sim_openfpga.xml
openfpga_vpr_device_layout=3x2
openfpga_vpr_route_chan_width=60
openfpga_vpr_clock_modeling=ideal
openfpga_vpr_flat_routing=on

[ARCHITECTURES]
arch0=${PATH:OPENFPGA_PATH}/openfpga_flow/vpr_arch/k4_N4_tileable_dsp8regbus_feedback_40nm.xml

[BENCHMARKS]
bench0=${PATH:TASK_DIR}/config/mult_8_feedback.blif

[SYNTHESIS_PARAM]
bench0_top = mult_8_feedback
bench0_verilog = ${PATH:TASK_DIR}/config/mult_8_feedback.v

[SCRIPT_PARAM_MIN_ROUTE_CHAN_WIDTH]
